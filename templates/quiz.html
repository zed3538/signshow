{% extends 'base.html' %}
{% block content %}

<!-- scripts are treated as the same static as images -->
<script src="{{url_for('static', filename='scripting.js')}}"></script>

<h1>What does this mean?</h1>

<div class="quiz-media">
    <video width="480" height="320" loop autoplay muted>
        <source src={{quiz[2]}}>
        Your browser does not support the video tag.
    </video>
</div>

    <div class="quiz-choices">
        {% for option in options %}
            <button type="button" 
                onclick="checkQuestion()" 
                value="{{option}}"
                {% if option == quiz[1] %} class="correct" {% endif %}
            >{{option}}</button>
        {% endfor %}
    </div>

{% endblock %}
