{% extends 'base.html' %}
{% block content %}

<!-- scripts are treated as the same static as images -->
<script src="{{url_for('static', filename='scripting.js')}}"></script>

<div class="quiz-question"><h1>What does this mean?</h1></div>

<div class="quiz-media">
    <video width="480" height="320" loop autoplay muted>
        <source src={{quiz[2]}}>
        Your browser does not support the video tag.
    </video>
</div>

    <div class="quiz-choices">
        {% for option in options %}
            <button type="button" 
                onclick="checkQuestion(event)"
                value="{{option}}"
                class="{% if option == quiz[1] %} correct {% else %} incorrect {% endif %}"
            >{{option}}</button>
        {% endfor %}
    </div>

{% endblock %}
