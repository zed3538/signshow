{% extends 'base.html' %}
{% block content %}
    <div class="login">
        <h1>Login</h1>
            <form action="/login" method="post">
                <label for="username">Username</label>
                <input type="text" name="username">
                <label for="password">Password</label>
                <input type="password" name="password">
                <button type="submit">Log in</button>
            </form>
    </div>
{% endblock %}
