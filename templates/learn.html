{% extends 'base.html' %}
{% block content %}
    {% if session['user'] %}
        <p class="welcome-msg">Welcome {{ session['user'][1] }}</p>
    {% endif %}

    <h1>Learn</h1>

    <div class="learn-1">
        <ul>
            {% for term in terms %}
                <li><a href="learn/{{term[0]}}">{{term[1]}}</a></li>
            {% endfor %}
        </ul>

    <div class="post-learn">
        <h3><a href="/learn/quiz-{{quiz[0]}}">Quiz me!</a></h3>
    </div>

{% endblock %}
