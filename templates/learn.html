{% extends 'base.html' %}
{% block content %}
    {% if session['user'] %}
        <p class="welcome-msg">Welcome {{ session['user'][1] }}</p>
    {% endif %}

    <h1>Learn</h1>

    <ul>
        {% for term in terms %}
            <li><a href="learn/{{term[0]}}">{{term[1]}}</a></li>
        {% endfor %}
    </ul>

{% endblock %}
