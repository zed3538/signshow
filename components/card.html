{% macro Card(article) %}
<div class="card">
    <a href="{{article['link_href']}}">
        <img src="{{ url_for('static', filename=page['img_src']) }}" alt="{{page['img alt']}}">
        <h5>{{article['title']}}</h5>
        <p>{{article['summary']}}</p>
        <label for="">{{article['link text']}}</label>
    </a>
</div>
{% endmacro %}
